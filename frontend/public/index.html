<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-100: #f4f4f5;
      --gray-200: #e4e4e7;
      --gray-300: #d1d1d6;
      --gray-400: #a1a1aa;
      --gray-500: #71717a;
      --gray-600: #52525b;
      --gray-700: #3f3f46;
      --gray-900: #18181b;
      --border: #e4e4e7;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-mono: 'Geist Mono', monospace;
      --radius: 6px;
      /* theme tokens — override in dark mode */
      --bg: #ffffff;
      --surface: #fafafa;
      --text: #0a0a0a;
      --text-dim: #71717a;
      --bd: #e4e4e7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--white); color: var(--black); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.5; }
    ::selection { background: var(--black); color: var(--white); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }
    textarea, input, button { font-family: var(--font-sans); }
    textarea { resize: none; }
    #root { height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .header { height: 48px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--white); flex-shrink: 0; }
    .header-left { display: flex; align-items: center; }
    .logo { display: flex; align-items: center; gap: 7px; padding-right: 18px; border-right: 1px solid var(--border); margin-right: 2px; }
    .logo-icon { width: 22px; height: 22px; background: var(--black); border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-text { font-size: 13px; font-weight: 600; color: var(--black); letter-spacing: -0.02em; }
    .mode-tabs { display: flex; align-items: center; padding-left: 4px; }
    .mode-tab { padding: 5px 12px; border: none; background: transparent; color: var(--gray-500); font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--radius); transition: all 0.12s; font-family: var(--font-sans); letter-spacing: -0.01em; }
    .mode-tab:hover { color: var(--black); background: var(--gray-100); }
    .mode-tab.active { color: var(--black); background: var(--gray-100); font-weight: 600; }
    .badge { display: flex; align-items: center; gap: 5px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 11px; color: var(--gray-500); font-family: var(--font-mono); }
    .dot-green { width: 5px; height: 5px; border-radius: 50%; background: #16a34a; flex-shrink: 0; }

    /* Workspace */
    .workspace { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* Editor side */
    .editor-side { width: 50%; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .toolbar { height: 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; gap: 3px; flex-shrink: 0; background: var(--gray-50); }
    .toolbar-sep { width: 1px; height: 14px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
    .chip { padding: 3px 9px; border-radius: 4px; border: none; background: transparent; color: var(--gray-500); font-size: 11.5px; font-weight: 500; cursor: pointer; font-family: var(--font-mono); transition: all 0.12s; }
    .chip:hover { background: var(--gray-200); color: var(--gray-900); }
    .chip.active { background: var(--black); color: var(--white); }
    .level-chip { padding: 3px 9px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--gray-400); font-size: 11.5px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); transition: all 0.12s; }
    .level-chip:hover { color: var(--black); border-color: var(--gray-300); }
    .level-chip.active { color: var(--black); border-color: var(--black); font-weight: 600; }
    .editor-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    .line-nums { width: 40px; padding: 16px 0; background: var(--gray-50); border-right: 1px solid var(--border); flex-shrink: 0; overflow: hidden; user-select: none; }
    .line-num { height: 21.45px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 11px; color: var(--gray-300); font-family: var(--font-mono); }
    .code-textarea { flex: 1; padding: 16px 16px 16px 12px; background: transparent; border: none; outline: none; font-family: var(--font-mono); font-size: 13px; line-height: 1.65; color: var(--gray-900); tab-size: 2; overflow-y: auto; white-space: pre; }
    .error-bar { border-top: 1px solid var(--border); padding: 10px 14px; background: #fef9f0; flex-shrink: 0; }
    .error-bar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--gray-400); font-family: var(--font-mono); margin-bottom: 5px; text-transform: uppercase; display: block; }
    .error-input { width: 100%; padding: 7px 10px; border: 1px solid #fcd34d; border-radius: var(--radius); background: #fffbeb; color: #92400e; font-family: var(--font-mono); font-size: 12px; outline: none; transition: border-color 0.15s; }
    .error-input:focus { border-color: #f59e0b; }
    .error-input::placeholder { color: #d97706; opacity: 0.6; }
    .action-bar { border-top: 1px solid var(--border); padding: 12px 14px; flex-shrink: 0; background: var(--white); }
    .lang-warning { padding: 10px 14px; background: #fffbeb; border-top: 2px solid #f59e0b; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; animation: fadeSlide 0.2s ease; }
    .lang-warning-text { font-size: 12px; color: #78350f; font-family: var(--font-sans); line-height: 1.5; }
    .lang-warning-btn { padding: 5px 12px; background: #92400e; border: none; border-radius: 4px; color: white; font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: var(--font-sans); white-space: nowrap; flex-shrink: 0; transition: background 0.15s; }
    .lang-warning-btn:hover { background: #78350f; }
    .run-btn { width: 100%; padding: 9px 16px; background: var(--black); border: none; border-radius: var(--radius); color: var(--white); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.15s; font-family: var(--font-sans); letter-spacing: -0.01em; }
    .run-btn:hover:not(:disabled) { background: var(--gray-700); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Output side */
    .output-side { width: 50%; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .output-header { height: 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; background: var(--gray-50); }
    .output-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; color: var(--gray-400); font-family: var(--font-mono); text-transform: uppercase; }
    .status-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--gray-400); font-family: var(--font-mono); }
    .output-body { flex: 1; overflow-y: auto; padding: 20px 22px 24px; min-height: 0; }
    .output-footer { border-top: 1px solid var(--border); padding: 7px 16px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; flex-shrink: 0; background: var(--gray-50); }
    .footer-label { font-size: 10px; color: var(--gray-300); font-family: var(--font-mono); margin-right: 3px; }
    .tag { font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px; color: var(--gray-400); font-family: var(--font-mono); background: var(--white); }

    /* Empty state */
    .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .empty-icon { width: 34px; height: 34px; border: 1.5px solid var(--gray-200); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--gray-300); margin-bottom: 2px; }
    .empty-title { font-size: 13px; font-weight: 500; color: var(--gray-500); }
    .empty-sub { font-size: 12px; color: var(--gray-400); line-height: 1.65; white-space: pre-line; }

    /* Markdown */
    @keyframes fadeSlide { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .md-section { display: flex; align-items: center; gap: 8px; margin-top: 22px; margin-bottom: 10px; animation: fadeSlide 0.2s ease; }
    .md-section:first-child { margin-top: 0; }
    .md-section-bar { width: 14px; height: 1px; background: var(--black); flex-shrink: 0; }
    .md-section-text { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--black); font-family: var(--font-mono); }
    .md-p { font-size: 13.5px; line-height: 1.8; color: var(--gray-700); margin-bottom: 8px; font-family: var(--font-sans); animation: fadeSlide 0.18s ease; text-transform: none; }
    .md-code-block { background: var(--gray-50); border: 1px solid var(--border); border-left: 2px solid var(--black); border-radius: var(--radius); padding: 12px 14px; margin: 8px 0 10px; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; color: var(--gray-900); overflow-x: auto; white-space: pre; animation: fadeSlide 0.18s ease; }
    .md-inline-code { font-family: var(--font-mono); font-size: 11.5px; background: var(--gray-100); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; color: var(--gray-900); }
    .md-bullet { display: flex; gap: 8px; margin-bottom: 5px; font-size: 13.5px; color: var(--gray-600); line-height: 1.75; font-family: var(--font-sans); animation: fadeSlide 0.18s ease; }
    .md-bullet-dot { color: var(--gray-400); flex-shrink: 0; margin-top: 1px; font-size: 12px; }
    .md-concept { display: flex; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; overflow: hidden; animation: fadeSlide 0.18s ease; }
    .md-concept-label { padding: 8px 12px; background: var(--gray-50); border-right: 1px solid var(--border); font-size: 11px; font-weight: 600; font-family: var(--font-mono); color: var(--black); min-width: 128px; display: flex; align-items: center; }
    .md-concept-desc { padding: 8px 12px; font-size: 13px; color: var(--gray-600); line-height: 1.65; font-family: var(--font-sans); display: flex; align-items: center; }
    .md-strong { font-weight: 600; color: var(--black); }
    /* Code block with language label */
    .md-code-wrap { margin: 8px 0 10px; }
    .md-code-lang { font-size: 10px; font-family: var(--font-mono); color: var(--gray-400); padding: 4px 14px; background: var(--gray-100); border: 1px solid var(--border); border-bottom: none; border-radius: var(--radius) var(--radius) 0 0; display: inline-block; }
    .md-code-wrap .md-code-block { margin: 0; border-radius: 0 var(--radius) var(--radius) var(--radius); }
    /* Numbered list */
    .md-bullet-num { font-size: 11px; font-weight: 700; color: var(--gray-400); font-family: var(--font-mono); min-width: 20px; flex-shrink: 0; padding-top: 1px; }
    /* Code annotation row: `line` — explanation */
    .md-annot { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--gray-100); animation: fadeSlide 0.18s ease; flex-wrap: wrap; }
    .md-annot:last-of-type { border-bottom: none; }
    .md-annot-code { font-family: var(--font-mono); font-size: 12px; background: var(--gray-100); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; color: var(--gray-900); white-space: nowrap; flex-shrink: 0; }
    .md-annot-sep { color: var(--gray-300); font-size: 12px; flex-shrink: 0; }
    .md-annot-text { font-size: 13px; color: var(--gray-600); font-family: var(--font-sans); line-height: 1.5; }
    .md-cursor { display: inline-block; width: 2px; height: 14px; background: var(--black); margin-left: 2px; vertical-align: middle; animation: blink 0.9s step-end infinite; }

    /* Skeleton */
    .skeleton { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
    .skeleton-line { border-radius: 3px; background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }

    /* Spinner */
    .spinner { width: 11px; height: 11px; border: 1.5px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.65s linear infinite; display: inline-block; }
    .pulse-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--black); animation: pulse 1.4s infinite; display: inline-block; }

    /* Challenge */
    .challenge-body { flex: 1; overflow-y: auto; padding: 22px; min-height: 0; }
    .progress-track { display: flex; gap: 3px; margin-bottom: 18px; }
    .progress-seg { flex: 1; height: 2px; background: var(--gray-200); border-radius: 2px; transition: background 0.25s; }
    .progress-seg.done { background: var(--black); }
    .question-heading { font-size: 16px; font-weight: 500; line-height: 1.55; color: var(--black); margin-bottom: 16px; letter-spacing: -0.02em; animation: fadeSlide 0.2s ease; }
    .options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .option { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); cursor: pointer; text-align: left; transition: all 0.12s; width: 100%; font-family: var(--font-sans); }
    .option:hover:not(.correct):not(.wrong) { border-color: var(--gray-400); background: var(--gray-50); }
    .option.correct { border-color: var(--black); background: var(--gray-50); cursor: default; }
    .option.wrong { border-color: #fca5a5; background: #fff5f5; cursor: default; }
    .option-key { font-size: 10px; font-weight: 700; color: var(--gray-300); font-family: var(--font-mono); min-width: 14px; flex-shrink: 0; }
    .option-text { flex: 1; font-size: 13px; color: var(--gray-700); line-height: 1.5; }
    .option-mark { font-size: 12px; font-weight: 700; font-family: var(--font-mono); flex-shrink: 0; }
    .explain-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--gray-50); margin-bottom: 14px; animation: fadeSlide 0.22s ease; }
    .explain-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--gray-400); font-family: var(--font-mono); text-transform: uppercase; margin-bottom: 6px; display: block; }
    .explain-text { font-size: 13px; color: var(--gray-600); line-height: 1.75; }
    .next-btn { padding: 8px 18px; background: var(--black); border: none; border-radius: var(--radius); color: var(--white); font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: var(--font-sans); letter-spacing: -0.01em; }
    .next-btn:hover { background: var(--gray-700); }
    .center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
    .muted { font-size: 12.5px; color: var(--gray-400); line-height: 1.65; }
    .score-screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; animation: fadeSlide 0.3s ease; }
    .score-glyph { font-size: 38px; margin-bottom: 4px; }
    .score-num { font-size: 48px; font-weight: 300; letter-spacing: -0.04em; color: var(--black); line-height: 1; }
    .score-denom { font-size: 26px; color: var(--gray-300); }
    .score-msg { font-size: 13px; color: var(--gray-500); margin-bottom: 4px; }

    /* ── Login screen ── */
    .login-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--white); gap: 0; }
    .login-card { width: 100%; max-width: 380px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .login-logo { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .login-logo-icon { width: 32px; height: 32px; background: var(--black); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .login-logo-text { font-size: 18px; font-weight: 700; color: var(--black); letter-spacing: -0.03em; }
    .login-tagline { font-size: 13px; color: var(--gray-400); text-align: center; line-height: 1.6; margin-top: -12px; }
    .login-divider { width: 100%; height: 1px; background: var(--border); }
    .login-label { font-size: 11px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.1em; text-transform: uppercase; font-family: var(--font-mono); align-self: flex-start; }
    .oauth-btn { width: 100%; padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); color: var(--gray-700); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.15s; font-family: var(--font-sans); letter-spacing: -0.01em; }
    .oauth-btn:hover { background: var(--gray-50); border-color: var(--gray-300); color: var(--black); }
    .oauth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-footer { font-size: 11px; color: var(--gray-400); text-align: center; line-height: 1.7; font-family: var(--font-sans); }
    /* User menu in header */
    .user-menu { display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--gray-200); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--gray-600); overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
    .user-email { font-size: 11.5px; color: var(--gray-500); font-family: var(--font-mono); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { padding: 3px 10px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--gray-500); font-size: 11px; cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; }
    .logout-btn:hover { border-color: var(--gray-400); color: var(--black); }
    @keyframes loginFade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .login-card { animation: loginFade 0.4s ease; }



    /* ── Language dropdown ── */
    .lang-dropdown { position:relative; }
    .lang-dropdown-btn { display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-mono);transition:all 0.15s;white-space:nowrap; }
    .lang-dropdown-btn:hover { border-color:var(--gray-400); }
    .lang-dropdown-menu { position:absolute;top:calc(100% + 4px);left:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:100;min-width:160px;overflow:hidden; }
    .lang-dropdown-item { padding:8px 14px;font-size:12.5px;color:var(--text-dim);cursor:pointer;font-family:var(--font-mono);transition:background 0.1s;display:block;width:100%;text-align:left;border:none;background:transparent; }
    .lang-dropdown-item:hover { background:var(--gray-100);color:var(--text); }
    .lang-dropdown-item.active { color:var(--text);font-weight:600;background:var(--gray-100); }

    /* ── Length selector ── */
    .length-sel { display:flex;gap:2px; }
    .length-btn { padding:3px 9px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--gray-400);font-size:11px;cursor:pointer;font-family:var(--font-sans);transition:all 0.12s; }
    .length-btn:hover { color:var(--text);border-color:var(--gray-300); }
    .length-btn.active { color:var(--text);border-color:var(--text);font-weight:600; }

    /* ── History panel ── */
    .history-panel { position:fixed;top:48px;right:0;bottom:0;width:320px;background:var(--bg);border-left:1px solid var(--border);z-index:200;display:flex;flex-direction:column;animation:slideLeft 0.2s ease; }
    @keyframes slideLeft { from{transform:translateX(100%)} to{transform:translateX(0)} }
    .history-header { padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
    .history-title { font-size:12px;font-weight:600;color:var(--text);font-family:var(--font-mono);letter-spacing:0.08em;text-transform:uppercase; }
    .history-close { width:24px;height:24px;border:none;background:transparent;cursor:pointer;color:var(--gray-400);font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:4px; }
    .history-close:hover { background:var(--gray-100);color:var(--text); }
    .history-list { flex:1;overflow-y:auto;padding:8px; }
    .history-item { padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:all 0.12s; }
    .history-item:hover { border-color:var(--gray-400);background:var(--surface); }
    .history-item-meta { display:flex;gap:6px;align-items:center;margin-bottom:4px; }

// ── Language detector ─────────────────────────────────────────────────────────
// Returns the most likely language based on syntax fingerprints in the code.
function detectLanguage(code) {
  const c = code.trim();
  if (!c) return null;

  const scores = {
    python: 0, javascript: 0, typescript: 0,
    rust: 0, go: 0, cpp: 0, c: 0, ruby: 0, html: 0, sql: 0,
  };

  // Python signals
  if (/^def \w+\s*\(/m.test(c))         scores.python += 3;
  if (/^class \w+.*:/m.test(c))           scores.python += 3;
  if (/^import \w+/m.test(c))             scores.python += 2;
  if (/^from \w+ import/m.test(c))        scores.python += 2;
  if (/:\s*$/.test(c))                    scores.python += 1;
  if (/elif |print\(|len\(|range\(/.test(c)) scores.python += 2;
  if (/f["'].*{/.test(c))                  scores.python += 2;

  // JavaScript signals
  if (/\bconst |\blet |\bvar /.test(c))  scores.javascript += 2;
  if (/=>/.test(c))                        scores.javascript += 2;
  if (/async\s+function|await /.test(c))  scores.javascript += 3;
  if (/\.then\(|\.catch\(/.test(c))     scores.javascript += 2;
  if (/console\.log|document\.|window\./.test(c)) scores.javascript += 3;
  if (/===|!==/.test(c))                   scores.javascript += 2;
  if (/^function \w+|^const \w+ = /.test(c)) scores.javascript += 2;

  // Rust signals
  if (/^fn \w+/m.test(c))                 scores.rust += 3;
  if (/let mut |\bVec<|\bi32\b|\busize\b/.test(c)) scores.rust += 3;
  if (/->\s*\w+/.test(c))                scores.rust += 2;
  if (/\bmatch\b/.test(c))               scores.rust += 3;
  if (/::\w+/.test(c))                    scores.rust += 2;
  if (/\.unwrap\(|Some\(|None/.test(c)) scores.rust += 3;
  if (/println!|vec!/.test(c))             scores.rust += 3;

  // Go signals
  if (/^func \w+/m.test(c))               scores.go += 3;
  if (/^package \w+/m.test(c))            scores.go += 3;
  if (/:=/.test(c))                        scores.go += 3;
  if (/^import\s+[("]/m.test(c))          scores.go += 2;
  if (/\bfmt\./.test(c))                 scores.go += 3;
  if (/\bgoroutine\b|\bchan\b/.test(c)) scores.go += 3;

  // TypeScript signals
  if (/:\s*(string|number|boolean|void|any|unknown)/.test(c)) scores.typescript += 3;
  if (/interface\s+\w+/.test(c))      scores.typescript += 3;
  if (/type\s+\w+\s*=/.test(c))      scores.typescript += 3;
  if (/<[A-Z][a-zA-Z]+>/.test(c))      scores.typescript += 2;
  if (/as\s+\w+/.test(c))             scores.typescript += 2;

  // C++ signals
  if (/#include\s*</.test(c))          scores.cpp += 3;
  if (/std::|cout|cin|endl/.test(c))    scores.cpp += 3;
  if (/vector<|map<|pair</.test(c))     scores.cpp += 3;
  if (/->|new\s+\w+/.test(c))         scores.cpp += 2;

  // C signals
  if (/#include\s*<stdio/.test(c))     scores.c += 3;
  if (/printf\(|scanf\(/.test(c))     scores.c += 3;
  if (/int main\(/.test(c))            scores.c += 3;
  if (/malloc\(|free\(/.test(c))      scores.c += 2;

  // Ruby signals
  if (/^def \w+/m.test(c))             scores.ruby += 3;
  if (/\.each|do \|/.test(c))         scores.ruby += 3;
  if (/puts |end$|nil/.test(c))         scores.ruby += 3;
  if (/\.times|\bloop\b/.test(c))    scores.ruby += 2;

  // HTML signals
  if (/<html|<div|<body|<head/.test(c)) scores.html += 3;
  if (/<\/\w+>/.test(c))              scores.html += 2;
  if (/<!DOCTYPE/.test(c))              scores.html += 3;

  // SQL signals
  if (/\bSELECT\b/i.test(c))          scores.sql += 3;
  if (/\bFROM\b|\bWHERE\b/i.test(c)) scores.sql += 3;
  if (/\bJOIN\b|\bGROUP BY\b/i.test(c)) scores.sql += 2;
  if (/\bINSERT|\bUPDATE|\bDELETE/i.test(c)) scores.sql += 2;

  const best = Object.entries(scores).sort((a,b) => b[1]-a[1])[0];
  return best[1] > 0 ? best[0] : null;
}

const SECTION_ALIASES = [
  'ROOT CAUSE','THE FIX','PREVENT IT NEXT TIME','HOW TO CATCH THIS EARLIER',
  'WHAT IT DOES','LINE BY LINE','WATCH OUT','KEY CONCEPTS','GOTCHAS',
  'STEP-BY-STEP WALKTHROUGH','STEP BY STEP WALKTHROUGH','GOTCHAS & EDGE CASES',
  'ROOT CAUSE ANALYSIS','EXPLANATION','SUMMARY',
];

function normalizeText(text) {
  let out = text;
  // Fix section headers missing ##
  SECTION_ALIASES.forEach(alias => {
    const lower = alias.charAt(0) + alias.slice(1).toLowerCase();
    out = out.split('\n').map(line => {
      const t = line.trim();
      if (t.toUpperCase() === alias || t.toUpperCase() === alias + ':') {
        return '## ' + lower;
      }
      return line;
    }).join('\n');
  });
  // Split concatenated annotations: `code` — desc`code2` — desc2
  // Find pattern: end of annotation followed immediately by backtick
  let result = '';
  let j = 0;
  while (j < out.length) {
    result += out[j];
    // If we see a backtick closing an annotation and next non-space char is also a backtick
    if (out[j] === '`' && j > 0) {
      let k = j + 1;
      while (k < out.length && out[k] === ' ') k++;
      if (k < out.length && out[k] === '`' && out[k-1] !== '\n') {
        result += '\n';
      }
    }
    j++;
  }
  // Split ## that got merged onto previous line
  result = result.split('').reduce((acc, ch, idx, arr) => {
    if (ch === '#' && idx > 0 && arr[idx-1] !== '\n' && arr[idx+1] === '#') {
      return acc + '\n' + ch;
    }
    return acc + ch;
  }, '');
  return result;
}

        <div key={k++} className="md-code-wrap">
          {lang && <div className="md-code-lang">{lang}</div>}
          <pre className="md-code-block"><code>{code.trimEnd()}</code></pre>
        </div>
      );
      i++; continue;
    }

    if (trimmed.startsWith('`') && trimmed.indexOf('`', 1) > 1) {
      const backtickEnd = trimmed.indexOf('`', 1);
      const after = trimmed.slice(backtickEnd + 1).trim();
      if (after.startsWith('—') || after.startsWith('-') || after.startsWith('–')) {
        const codepart = trimmed.slice(1, backtickEnd);
        const desc = after.replace(/^[—\-–]+\s*/, '');
        els.push(
          <div key={k++} className="md-annot">
            <code className="md-annot-code">{codepart}</code>
            <span className="md-annot-sep">—</span>
            <span className="md-annot-text">{renderInline(toSentenceCase(desc))}</span>
          </div>
        );
        i++; continue;
      }
    }

    if (trimmed.startsWith('**')) {
      const labelEnd = trimmed.indexOf('**', 2);
      if (labelEnd > 2) {
        const label = trimmed.slice(2, labelEnd);
        const rest = trimmed.slice(labelEnd + 2).trim().replace(/^[—\-–:]+\s*/, '');
        if (rest) {
          els.push(
            <div key={k++} className="md-concept">
              <div className="md-concept-label">{label}</div>
              <div className="md-concept-desc">{renderInline(toSentenceCase(rest))}</div>
            </div>
          );
          i++; continue;
        }
      }
    }

    const numM = trimmed.match(/^(\d+)\.\s+(.+)$/);
    if (numM) {
      els.push(
        <div key={k++} className="md-bullet">
          <span className="md-bullet-num">{numM[1]}.</span>
          <span>{renderInline(toSentenceCase(numM[2]))}</span>
        </div>
      );
      i++; continue;
    }

    if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
      els.push(
        <div key={k++} className="md-bullet">
          <span className="md-bullet-dot">–</span>
          <span>{renderInline(toSentenceCase(trimmed.slice(2)))}</span>
        </div>
      );
      i++; continue;
    }

    if (trimmed) {
      els.push(<p key={k++} className="md-p">{renderInline(toSentenceCase(trimmed))}</p>);
    }
    i++;
  }
  return els;
}

function App() {
  // ── Auth state ────────────────────────────────────────────────────────────
  const [session, setSession]   = useState(null);
  const [authLoading, setAuthLoading] = useState(true);

  useEffect(() => {
    // onAuthStateChange fires FIRST when hash contains OAuth tokens
    // This handles both Google and GitHub on the very first click
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      setSession(session);
      setAuthLoading(false);
      // Clean URL hash after OAuth redirect
      if (window.location.hash) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      // Log every new login to Supabase
      if (_event === 'SIGNED_IN' && session) {
        sb.from('user_logins').insert({
          user_id: session.user.id,
          user_email: session.user.email,
          provider: session.user.app_metadata?.provider || 'unknown',
        }).then(() => {});
      }
    });

    // Also check for existing session (returning user, page refresh)
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        setSession(session);
        setAuthLoading(false);
      } else {
        // No session found — check complete, show login
        setAuthLoading(false);
      }
    });

    return () => subscription.unsubscribe();
  }, []);

  const logout = async () => {
    await sb.auth.signOut();
    setSession(null);
  };

  // ── App state — ALL hooks must be declared before any return ────────────────
  const [mode, setMode]         = useState("understand");
  const [level, setLevel]       = useState("beginner");
  const [lang, setLang]         = useState("python");
  const [code, setCode]         = useState(SAMPLES.python);
  const [output, setOutput]     = useState("");
  const [streaming, setStreaming] = useState(false);
  const [starting, setStarting]   = useState(false);
  const [debugError, setDebugError] = useState("");
  const [langMismatch, setLangMismatch] = useState(null);
  const [length, setLength]       = useState("medium");   // short | medium | detailed
  const [history, setHistory]     = useState([]);          // [{lang, level, mode, code, output, ts}]
  const [showHistory, setShowHistory] = useState(false);
  const [langDropdownOpen, setLangDropdownOpen] = useState(false);

  const [questions, setQuestions]     = useState([]);
  const [quizLoading, setQuizLoading] = useState(false);
  const [qi, setQi]     = useState(0);
  const [ans, setAns]   = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone]       = useState(false);
  const [codeAnswer, setCodeAnswer] = useState('');
  const [evalScore, setEvalScore]   = useState(0);

  const bodyRef = useRef(null);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [output]);

  const savedCode = React.useRef({});

  // ── Derived from session (safe after all hooks) ───────────────────────────
  const user = session?.user || null;
  const userInitial = user ? (user.email || "?")[0].toUpperCase() : "?";

  // ── Early returns AFTER all hooks ─────────────────────────────────────────
  if (authLoading) return (
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span className="spinner" style={{width:20,height:20,borderWidth:2}}/>
    </div>
  );

  if (!session) return <LoginScreen/>;

  const changeLang = l => {
    if (l === lang) return; // same language, do nothing
    // Save whatever is currently in the editor for the OLD language
    savedCode.current[lang] = code;
    // Load saved code for NEW language if user typed something there before,
    // otherwise fall back to the sample
    const next = savedCode.current[l] !== undefined ? savedCode.current[l] : (SAMPLES[l] || "");
    setLang(l);
    setCode(next);
    setLangMismatch(null);
    setOutput(""); setStarting(false);
  };

  const handleCodeChange = e => {
    const val = e.target.value;
    setCode(val);
    // Detect language mismatch as user types
    if (val.trim().length > 40) {
      const detected = detectLanguage(val);
      setLangMismatch(detected && detected !== lang ? detected : null);
    } else {
      setLangMismatch(null);
    }
  };
  const changeMode = m => { setMode(m); setOutput(""); setStarting(false); setQuestions([]); setQi(0); setAns(null); setScore(0); setDone(false); };

  const analyze = async () => {
    // Block if language mismatch detected
    const detected = detectLanguage(code);
    if (detected && detected !== lang) {
      setLangMismatch(detected);
      return; // stop — force user to fix the tab first
    }
    setStarting(true); setOutput(""); setStreaming(false);
    const endpoint = mode==="debug" ? "/api/debug"
      : mode==="complexity" ? "/api/complexity"
      : mode==="bugs" ? "/api/bugs"
      : "/api/explain";
    const body = mode==="debug" ? {code,language:lang,error:debugError}
      : (mode==="complexity"||mode==="bugs") ? {code,language:lang}
      : {code,language:lang,level,length};
    try {
      // Attach Supabase JWT so backend can verify the user
    const { data: { session: sess } } = await sb.auth.getSession();
    const token = sess?.access_token || "";
    const res = await fetch(`${API}${endpoint}`, {method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify(body)});
      if (!res.ok) { const e=await res.json().catch(()=>({})); setOutput(`**Error** — ${e.detail||res.statusText}`); setStarting(false); return; }
      setStarting(false); setStreaming(true);
      let currentOutput = "";
      const reader = res.body.getReader(); const decoder = new TextDecoder(); let buf="";
      while (true) {
        const {done,value} = await reader.read(); if (done) break;
        buf += decoder.decode(value,{stream:true});
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const token = line.slice(6);
            if (token==='[DONE]') {
              setStreaming(false);
              // Log usage to Supabase
              sb.from('usage_logs').insert({
                user_id: user.id,
                user_email: user.email,
                mode: mode,
                language: lang,
                level: level,
                code_length: code.length,
              }).then(() => {});
              // Save to local history
              setHistory(prev => [{
                lang, level, mode, length,
                code: code.slice(0, 300),
                output: currentOutput,
                ts: new Date().toLocaleTimeString()
              }, ...prev.slice(0, 19)]);
              return;
            }
            currentOutput += token;
            setOutput(p=>p+token);
          }
        }
      }
    } catch(e) { setOutput(`**Connection error** — ${e.message}\n\nMake sure the backend is running:\n\`python -m uvicorn main:app --reload --port 8000\``); setStarting(false); }
    setStreaming(false);
  };

  const generateQuiz = async () => {
    setQuizLoading(true); setQuestions([]); setQi(0); setAns(null); setScore(0); setDone(false);
    try {
      const { data: { session: qSess } } = await sb.auth.getSession();
      const qToken = qSess?.access_token || "";
      const res = await fetch(`${API}/api/challenge/generate`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${qToken}`},body:JSON.stringify({code,language:lang,level})});
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json(); setQuestions(data.questions||[]);
    } catch(e) { alert("Backend error: "+e.message); }
    setQuizLoading(false);
  };

  const answer = i => { if (ans!==null) return; setAns(i); if (i===questions[qi].correct) setScore(s=>s+1); };
  const next = () => {
    if (qi<questions.length-1) { setQi(q=>q+1); setAns(null); setCodeAnswer(''); setEvalScore(0); }
    else setDone(true);
  };

  const lines = code.split('\n');

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}} >
      {/* Header */}
      <header className="header">
        <div className="header-left">
          <div className="logo">
            <div className="logo-icon">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                <path d="M2 4l-2 3 2 3M12 4l2 3-2 3M9 1L5 13" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <span className="logo-text">DeepCode</span>
          </div>
          <nav className="mode-tabs">
            {MODES.map(m=><button key={m.id} className={`mode-tab${mode===m.id?' active':''}`} onClick={()=>changeMode(m.id)}>{m.label}</button>)}
          </nav>
        </div>
        <div className="user-menu">
          <div className="badge"><div className="dot-green"/><span>gpt-oss-120b · groq</span></div>
          <button className="history-btn" onClick={()=>setShowHistory(h=>!h)}>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" strokeWidth="1.2"/><path d="M6 3v3l2 1" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
            History {history.length > 0 && <span style={{fontSize:10,background:'var(--gray-200)',borderRadius:8,padding:'0 5px',color:'var(--text)'}}>{history.length}</span>}
          </button>

          <div className="user-avatar">
            {user.user_metadata?.avatar_url
              ? <img src={user.user_metadata.avatar_url} width="26" height="26" style={{borderRadius:"50%",display:"block"}}/>
              : userInitial}
          </div>
          <span className="user-email">{user.email}</span>
          <button className="logout-btn" onClick={logout}>Sign out</button>
        </div>
      </header>

      {/* Workspace */}
      <div className="workspace">

        {/* Left: Editor */}
        <div className="editor-side">
          <div className="toolbar">
            {/* Language dropdown */}
            <div className="lang-dropdown">
              <button className="lang-dropdown-btn" onClick={()=>setLangDropdownOpen(o=>!o)}>
                {LANGS.find(l=>l.id===lang)?.label || lang}
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
              {langDropdownOpen && (
                <div className="lang-dropdown-menu">
                  {LANGS.map(l=>(
                    <button key={l.id} className={`lang-dropdown-item${lang===l.id?' active':''}`} onClick={()=>{changeLang(l.id);setLangDropdownOpen(false);}}>
                      {l.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
            {(mode==='understand') && <>
              <div className="toolbar-sep"/>
              {LEVELS.map(lv=><button key={lv} className={`level-chip${level===lv?' active':''}`} onClick={()=>setLevel(lv)}>{lv.charAt(0).toUpperCase()+lv.slice(1)}</button>)}
              <div className="toolbar-sep"/>
              <div className="length-sel">
                {["short","medium","detailed"].map(l=>(
                  <button key={l} className={`length-btn${length===l?' active':''}`} onClick={()=>setLength(l)}>
                    {l.charAt(0).toUpperCase()+l.slice(1)}
                  </button>
                ))}
              </div>
            </>}
          </div>
          <div className="editor-body">
            <div className="line-nums">{lines.map((_,i)=><div key={i} className="line-num">{i+1}</div>)}</div>
            <textarea className="code-textarea" value={code} onChange={handleCodeChange} spellCheck={false} autoCorrect="off" autoCapitalize="off"/>
          </div>
          {mode==='debug' && (
            <div className="error-bar">
              <span className="error-bar-label">Error Message</span>
              <input className="error-input" value={debugError} onChange={e=>setDebugError(e.target.value)} placeholder="Paste the exact error message here (e.g. TypeError: ...)"/>
            </div>
          )}
          {langMismatch && (
            <div className="lang-warning">
              <span className="lang-warning-text">⚠ This looks like <strong>{langMismatch}</strong> code, but the tab is set to <strong>{lang}</strong>. Analysis is blocked until you fix this.</span>
              <button className="lang-warning-btn" onClick={() => changeLang(langMismatch)}>Switch to {langMismatch}</button>
            </div>
          )}
          <div className="action-bar">
            {mode==='challenge'
              ? <button className="run-btn" onClick={generateQuiz} disabled={quizLoading}>{quizLoading?<><span className="spinner"/> Generating...</>:'Generate Quiz'}</button>
              : <button className="run-btn" onClick={analyze} disabled={streaming||starting}>{(streaming||starting)?<><span className="spinner"/> {starting?'Starting...':'Analyzing…'}</>:mode==='debug'?'Diagnose Bug':mode==='complexity'?'Analyse Complexity':mode==='bugs'?'Find Bugs':'Analyze Code'}</button>
            }
          </div>
        </div>

        {/* Right: Output */}
        <div className="output-side">

          {/* Challenge */}
          {mode==='challenge' && <>
            <div className="output-header">
              <span className="output-label">Challenge</span>
              {questions.length>0&&!done&&<span className="status-pill">{qi+1}/{questions.length} · {score} correct</span>}
            </div>
            <div className="challenge-body">
              {!quizLoading&&questions.length===0&&(
                <div className="center">
                  <div className="empty-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" strokeWidth="1.2"/><path d="M8 5v3.5M8 10.5v.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg></div>
                  <p className="empty-title">No questions yet</p>
                  <p className="muted">Click Generate Quiz to create<br/>questions from your code</p>
                </div>
              )}
              {quizLoading&&<div className="center"><span className="spinner" style={{width:18,height:18,borderWidth:2}}/><p className="muted">Writing fresh questions<br/>from your code...</p></div>}
              {done&&(
                <div className="score-screen">
                  <div className="score-glyph">{score===questions.length?'◆':score>=questions.length/2?'◇':'○'}</div>
                  <div className="score-num">{score}<span className="score-denom">/{questions.length}</span></div>
                  <p className="score-msg">{score===questions.length?'Perfect score.':score>=questions.length/2?'Good. Review the ones you missed.':'Try Understand mode first.'}</p>
                  <button className="next-btn" style={{marginTop:8}} onClick={generateQuiz}>New Questions</button>
                </div>
              )}
              {!quizLoading&&questions.length>0&&!done&&(()=>{
                const q=questions[qi];
                const qtype = q.type || 'mcq';
                return (
                  <div>
                    <div className="progress-track">{questions.map((_,i)=><div key={i} className={`progress-seg${i<=qi?' done':''}`}/>)}</div>

                    {/* Question type badge */}
                    <span className={`q-type-badge ${qtype==='mcq'?'badge-mcq':qtype==='complete_function'?'badge-complete':'badge-test'}`}>
                      {qtype==='mcq'?'Multiple Choice':qtype==='complete_function'?'Complete the Function':'Write a Test'}
                    </span>

                    <p className="question-heading">{q.question}</p>

                    {/* ── MCQ ── */}
                    {qtype==='mcq' && (
                      <div className="options">
                        {q.options.map((opt,i)=>{
                          const correct=i===q.correct, selected=ans===i, revealed=ans!==null;
                          let cls='option'; if(revealed&&correct) cls+=' correct'; else if(revealed&&selected) cls+=' wrong';
                          return <button key={i} className={cls} onClick={()=>answer(i)}>
                            <span className="option-key">{String.fromCharCode(65+i)}</span>
                            <span className="option-text">{opt}</span>
                            {revealed&&correct&&<span className="option-mark">✓</span>}
                            {revealed&&selected&&!correct&&<span className="option-mark" style={{color:'#ef4444'}}>✗</span>}
                          </button>;
                        })}
                      </div>
                    )}

                    {/* ── Complete the Function ── */}
                    {qtype==='complete_function' && (
                      <div className="code-challenge-wrap">
                        <span className="code-challenge-label">Starter Code</span>
                        <pre className="code-starter">{q.starter_code}</pre>
                        <span className="code-challenge-label">Your Solution</span>
                        <textarea
                          className="code-challenge-editor"
                          value={codeAnswer}
                          onChange={e=>setCodeAnswer(e.target.value)}
                          placeholder="Write your complete function here..."
                          disabled={ans !== null}
                          spellCheck={false}
                        />
                        {ans === null && (
                          <button className="submit-btn" onClick={()=>submitCodeAnswer(q)}>
                            Submit Solution
                          </button>
                        )}
                        {ans !== null && (
                          <div className={`eval-result ${evalScore>=70?'eval-good':'eval-ok'}`}>
                            <span className="explain-label">Feedback · {evalScore}% match</span>
                            <p className="explain-text">{q.explanation}</p>
                            <details style={{marginTop:8}}>
                              <summary style={{fontSize:11,color:'var(--gray-400)',cursor:'pointer',fontFamily:'var(--font-mono)'}}>See solution</summary>
                              <pre style={{marginTop:6,fontSize:11.5,fontFamily:'var(--font-mono)',background:'var(--gray-100)',padding:'8px',borderRadius:4,overflow:'auto'}}>{q.solution}</pre>
                            </details>
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── Write a Test ── */}
                    {qtype==='write_test' && (
                      <div className="code-challenge-wrap">
                        <span className="code-challenge-label">Function to Test</span>
                        <pre className="code-starter">{q.function_to_test}</pre>
                        <span className="code-challenge-label">Your Test</span>
                        <textarea
                          className="code-challenge-editor"
                          value={codeAnswer}
                          onChange={e=>setCodeAnswer(e.target.value)}
                          placeholder="Write your test function here..."
                          disabled={ans !== null}
                          spellCheck={false}
                          defaultValue={q.test_starter}
                        />
                        {ans === null && (
                          <button className="submit-btn" onClick={()=>submitCodeAnswer(q)}>
                            Submit Test
                          </button>
                        )}
                        {ans !== null && (
                          <div className={`eval-result ${evalScore>=70?'eval-good':'eval-ok'}`}>
                            <span className="explain-label">Feedback · {evalScore}% coverage</span>
                            <p className="explain-text">{q.explanation}</p>
                            <details style={{marginTop:8}}>
                              <summary style={{fontSize:11,color:'var(--gray-400)',cursor:'pointer',fontFamily:'var(--font-mono)'}}>See sample solution</summary>
                              <pre style={{marginTop:6,fontSize:11.5,fontFamily:'var(--font-mono)',background:'var(--gray-100)',padding:'8px',borderRadius:4,overflow:'auto'}}>{q.sample_solution}</pre>
                            </details>
                          </div>
                        )}
                      </div>
                    )}

                    {ans!==null&&<div className="explain-box" style={{marginTop:10}}><span className="explain-label">Explanation</span><p className="explain-text">{q.explanation}</p></div>}
                    {ans!==null&&<button className="next-btn" style={{marginTop:10}} onClick={next}>{qi<questions.length-1?'Next →':'See Results →'}</button>}
                  </div>
                );
              })()}
            </div>
          </>}

          {/* Understand / Debug */}
          {mode!=='challenge'&&<>
            <div className="output-header">
              <span className="output-label">{mode==='debug'?'Root Cause Analysis':mode==='complexity'?'Complexity Analysis':mode==='bugs'?'Bug Finder':`Explanation · ${level}`}</span>
              {streaming&&<div className="status-pill"><span className="pulse-dot"/> streaming</div>}
              {!streaming&&!starting&&output&&<div className="status-pill"><span style={{width:5,height:5,borderRadius:'50%',background:'#16a34a',display:'inline-block'}}/> done</div>}
            </div>
            <div className="output-body" ref={bodyRef}>
              {!output&&!streaming&&!starting&&(
                <div className="empty">
                  <div className="empty-icon"><svg width="15" height="15" viewBox="0 0 14 14" fill="none"><path d="M2 4l-2 3 2 3M12 4l2 3-2 3M9 1L5 13" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
                  <p className="empty-title">{mode==='debug'?'Paste code and error message':'Ready to analyze'}</p>
                  <p className="empty-sub">{mode==='debug'?'Enter the error below,\nthen click Diagnose Bug':mode==='complexity'?'Paste code and click Analyse Complexity':mode==='bugs'?'Paste code and click Find Bugs':'Select language and level,\nthen click Analyze Code'}</p>
                </div>
              )}
              {starting&&<div className="skeleton">
                <div className="skeleton-line" style={{width:'38%',height:11}}/>
                <div className="skeleton-line" style={{width:'92%',height:13}}/>
                <div className="skeleton-line" style={{width:'78%',height:13}}/>
                <div className="skeleton-line" style={{width:'85%',height:13}}/>
                <div style={{height:8}}/>
                <div className="skeleton-line" style={{width:'32%',height:11}}/>
                <div className="skeleton-line" style={{width:'96%',height:13}}/>
                <div className="skeleton-line" style={{width:'70%',height:13}}/>
              </div>}
              {(output||streaming)&&!starting&&<div>{renderMarkdown(output)}{streaming&&<span className="md-cursor"/>}</div>}
            </div>
            <div className="output-footer">
              <span className="footer-label">stack</span>
              {['Groq API','GPT-OSS 120B','SSE streaming'].map(t=><span key={t} className="tag">{t}</span>)}
            </div>
          </>}

        </div>
      </div>

      {/* History sidebar */}
      {showHistory && (
        <div className="history-panel">
          <div className="history-header">
            <span className="history-title">History</span>
            <button className="history-close" onClick={()=>setShowHistory(false)}>×</button>
          </div>
          <div className="history-list">
            {history.length === 0 && (
              <div className="history-empty">No history yet.<br/>Analyze some code to get started.</div>
            )}
            {history.map((item, i) => (
              <div key={i} className="history-item" onClick={()=>{
                changeLang(item.lang);
                setLevel(item.level);
                setMode(item.mode);
                setLength(item.length || 'medium');
                setCode(item.code);
                setOutput(item.output);
                setShowHistory(false);
              }}>
                <div className="history-item-meta">
                  <span className="history-tag">{item.lang}</span>
                  <span className="history-tag">{item.level}</span>
                  <span className="history-tag">{item.mode}</span>
                </div>
                <div className="history-item-code">{item.code.split("\n")[0]}</div>
                <div className="history-item-time">{item.ts}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
